<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Segoe UI,Arial,sans-serif;max-width:900px;margin:0 auto;padding:20px}article{border:1px solid #ddd;border-radius:8px;padding:12px;margin:10px 0}.meta{color:#666;font-size:12px}</style></head><body>
<h1>Creative Output</h1>
<p>独立于 Knowledge Blog 的创作通道（可展示 draft；是否公开由人类决定）。</p>
<div id="list"></div>
<script>
fetch('../_pkos/blog_index.json').then(r=>r.json()).then(rows=>{
  const list=document.getElementById('list');
  const creative=rows.filter(x=>String(x.channel||'')==='creative');
  if(!creative.length){list.innerHTML='<p class="meta">No creative entries in public index yet.</p>';return;}
  list.innerHTML=creative.map(x=>`<article><h3>${x.title||x.slug}</h3><div class="meta">status: ${x.status||'draft'} | created: ${x.created_at||''} | updated: ${x.updated_at||''}</div><p>${x.summary||''}</p><div class="meta">tags: ${(x.tags||[]).join(', ')}</div><div class="meta">path: ${x.path||''}</div></article>`).join('');
});
</script>
</body></html>
